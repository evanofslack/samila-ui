name: ci
on:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: install
        run: uv sync --frozen

      - name: format
        run: uv run ruff format --check .

      - name: lint
        run: uv run ruff check .

      - name: import
        run: uv run python -c "import app.main"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: type check
        run: npm run type-check

      - name: build
        run: npm run build
