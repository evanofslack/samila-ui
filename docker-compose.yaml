services:
  samila:
    image: evanofslack/samila:latest
    container_name: samila
    restart: unless-stopped
    # only reachable through the reverse proxy on this host
    ports:
      - 127.0.0.1:8080:8080
    environment:
      # behind caddy, take the client ip from a header instead of the proxy's address
      TRUST_PROXY: "true"
      # behind cloudflare, the rightmost X-Forwarded-For entry is a cloudflare edge ip,
      # so read the header cloudflare sets. use X-Forwarded-For when caddy faces clients directly
      CLIENT_IP_HEADER: CF-Connecting-IP
      # RATE_LIMIT_PER_MINUTE: 10
      # GLOBAL_RATE_LIMIT_PER_MINUTE: 60
      # RENDER_WORKERS: 2
